name: release

# Builds the SD package plus its corresponding source and attaches them to a
# GitHub release. Manual, or on a v* tag: Actions tab, or
#   gh workflow run release.yml -f tag=v0.2.0

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.2.0)"
        required: true
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-sd:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      REPOS_DIR: ${{ github.workspace }}/repos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake wget patch build-essential

      # Build dependencies are not vendored: clone the cross-toolchain here;
      # build_sd.sh clones and pins the yi-hack tree itself.
      - name: Clone cross-toolchain
        run: |
          mkdir -p "$REPOS_DIR"
          git clone --depth 1 \
            https://github.com/lindenis-org/lindenis-v536-prebuilt \
            "$REPOS_DIR/toolchain-sunxi-musl"

      - name: Resolve tag
        run: |
          TAG="${{ inputs.tag }}"; [ -n "$TAG" ] || TAG="${GITHUB_REF_NAME}"
          TAG=$(printf '%s' "$TAG" | tr '/' '-')
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # Builds the image and the corresponding-source bundle and writes
      # SHA256SUMS, all named yi-protect-<tag>... (NAME is threaded through
      # build_sd.sh so the package carries the tag, not the git revision).
      - name: Build package + source
        run: NAME="$TAG" sh release.sh

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: yi-protect
          body: |
            yi-protect SD-card image for Yi cameras presented as native UniFi
            Protect hardware (`${{ env.TAG }}`). The camera keeps its stock
            firmware; this is a self-contained stack installed from the SD card.

            - `yi-protect-${{ env.TAG }}.tar.gz` — the SD package. Extract the
              contents to the FAT32 root of the card and boot the camera (see
              the README, "Install (prebuilt)").
            - `yi-protect-${{ env.TAG }}-src.tar.gz` — complete corresponding
              source for our AGPL code and the bundled GPL/LGPL components.
            - `SHA256SUMS` — verify with `sha256sum -c SHA256SUMS`.

            The base image runs the stock Yi `rmm` encoder. The optional
            clean-room `mediad` encoder (H.264 + H.265) ships as a separate
            overlay release in the yi-mediad repo.
          files: |
            yi-protect-${{ env.TAG }}.tar.gz
            yi-protect-${{ env.TAG }}-src.tar.gz
            SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: yi-protect-sd
          path: |
            yi-protect-*.tar.gz
            SHA256SUMS
