name: release

# Builds the SD package from source and attaches it to a GitHub release. Manual
# only (tags do not trigger it): Actions tab or `gh workflow run release.yml -f tag=v0.1.0`.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create/update (e.g. v0.1.0)"
        required: true

permissions:
  contents: write

jobs:
  build-sd:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    env:
      REPOS_DIR: ${{ github.workspace }}/repos
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake wget patch build-essential

      # Build dependencies are not vendored. Clone them into REPOS_DIR: the
      # pinned yi-hack tree (dropbear/alsa/IPC helpers) and the cross-toolchain.
      - name: Clone cross-toolchain
        run: |
          mkdir -p "$REPOS_DIR"
          git clone --depth 1 \
            https://github.com/lindenis-org/lindenis-v536-prebuilt \
            "$REPOS_DIR/toolchain-sunxi-musl"
      # build_sd.sh clones and pins the yi-hack tree itself.

      - name: Build SD package
        run: sh build_sd.sh

      - name: Checksum
        run: sha256sum yi-protect-*.tar.gz > SHA256SUMS

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            yi-protect-*.tar.gz
            SHA256SUMS

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yi-protect-sd
          path: yi-protect-*.tar.gz
