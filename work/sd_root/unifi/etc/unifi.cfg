#
# UniFi Protect emulation -- project-owned configuration.
#
# This file replaces yi-hack's system.conf/camera.conf. Plain KEY=value,
# '#' comments, blank lines ignored. Read by unifi/script/init.sh at boot and
# by unifi_avclient_go: this is the single human-edited config file;
# runtime state lives in the unifi_client_go.* state files.

# Video/audio options passed to unifi_flv_bridge.
#   RESOLUTION: high | low | both
#   AUDIO:      aac | no   (aac is what this project's FlvPush path expects)
RESOLUTION=both
AUDIO=aac

# PTZ: yes | no | (empty = auto). Only for units with a real motorized
# pan/tilt base -- this sets the declared "ptz" featureFlag, which is what puts
# PTZ controls in the Protect UI. Empty auto-detects from the model so a single
# SD image is correct everywhere (y623 -> no, h52ga/r35gb -> yes).
PTZ=

# IS_MEDIAD: yes | no (default no). Set yes when the sister project's custom
# rmm replacement (mediad) overlay is installed: init.sh then launches it via
# script/mediad.sh instead of the stock rmm, and watchdog.sh watches/restarts
# it. mediad publishes the same /dev/shm/fshare_frame_buf ring, so
# unifi_flv_bridge is untouched. The client also requires a running mediad (a
# "mediad*" process whose /tmp/mediad_ctl.sock answers ping) and only then
# forwards Protect's picture controls (brightness/contrast/hue/saturation/
# sharpness/denoise/3DNR/WDR/mirror/flip/flicker) and the HIGH channel bitrate
# to it. Stock rmm cannot apply those controls, so with no mediad the fields are
# acknowledged and ignored, exactly as before. Infrared/night-vision is owned by
# mediad when present, else the cpld_ctl/lux path. The mediad installer sets this
# key; you normally don't edit it by hand.
IS_MEDIAD=no

# YI_CLOUD: yes | no | (empty = auto). When on, init.sh also starts the stock
# Yi cloud daemons (cloud, p2p_tnp, oss) so the camera still appears in the YI
# app while the Protect emulation runs. Auto means ON, except on mediad builds
# (IS_MEDIAD=yes), where it stays OFF: mediad replaces the stock encoder daemon
# and the Yi cloud is not run alongside it. Set no to force local-only (no Yi
# cloud traffic), or yes to force the daemons on. Note: the stock cloudAPI stays
# in place, so Yi's cloud (and its firmware update checks) behave exactly as on
# an unmodified camera. The daemons cost CPU/RAM on this 60MB single-core board.
YI_CLOUD=

# SSH_PASSWORD: root's SSH (dropbear) login password. Applied at boot by
# init.sh, which hashes it to the only scheme the camera's musl crypt()
# implements (MD5-crypt, $1$) and writes it into /etc/shadow, replacing the
# stock blank root password (with dropbear's -B that would otherwise allow an
# empty-password root login). The shipped default is admin; change it, or leave
# it empty to keep the stock blank login. The controller's UpdateUsernamePassword
# push is not applied yet (todo.md item 26).
SSH_PASSWORD=admin

# SSH_UBUNT_PASSWORD: password for the second SSH account, "ubnt". This is the
# account native Protect cameras expose and that the controller manages; it is
# deliberately separate from root so a controller-driven credential rotation
# cannot lock out the human root login. init.sh creates the user and hashes this
# the same way as SSH_PASSWORD. Default "ubnt" (the native pre-adoption value).
# The controller's UpdateUsernamePassword push will override it once wired
# (todo.md item 26). Both accounts are served by the single dropbear on :22.
SSH_UBUNT_PASSWORD=ubnt

# WiFi provisioning (SD card): to set the camera's WiFi without the Yi app,
# create unifi/etc/configure_wifi.cfg (or Factory/configure_wifi.cfg on a fresh
# card) containing:
#     wifi_ssid=My Network
#     wifi_psk=my-password
# and drop it on the card; init.sh writes it to the conf partition and reboots
# once to associate. See unifi/etc/configure_wifi.cfg.example.

# Optional controller override (host or host:port). Read by unifi_avclient_go
# directly and takes priority over the DHCP-discovered controller. Leave empty
# for DHCP-based discovery.
#CONTROLLER=protect-controller:7442

# Optional camera-identity override. Empty = compiled-in default (the "UVC G3
# Instant" spoof, sysid 0xa590). SYSID is hex.
#MODEL=UVC G3 Instant
#SYSID=0xa590
#FWVERSION=UVC.SAV532Q.v4.75.62.67.9cdac69.260331.1630

# Optional static network. If STATIC_IP and STATIC_MASK are both set, the
# vendored wifidhcp.sh/ethdhcp.sh use them instead of DHCP. Leave empty for
# DHCP. DNS/GW are optional.
#STATIC_IP=
#STATIC_MASK=
#STATIC_GW=
#STATIC_DNS1=
#STATIC_DNS2=

# Process watchdog poll interval (seconds). See unifi/script/watchdog.sh.
WATCHDOG_INTERVAL=10
