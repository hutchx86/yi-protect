# UniFi Protect emulation -- project-owned config (replaces yi-hack's system.conf).
# Plain KEY=value, read by init.sh and yi_protect_avclient_go; runtime state is in yi_protect_client_go.*.

# yi_protect_flv_bridge video/audio: RESOLUTION=high|low|both, AUDIO=aac|no.
RESOLUTION=both
AUDIO=aac

# PTZ: yes|no|(empty=auto). Declares the "ptz" featureFlag that puts PTZ controls
# in the Protect UI; auto = the model's ptz column (from model_table).
PTZ=

# IS_MEDIAD: yes|no (default no). Set yes when the optional mediad replaces stock
# rmm (script/mediad.sh, installed by yi-mediad's install-mediad.sh; watched by watchdog).
IS_MEDIAD=no

# MEDIAD_3DNR: yes|no (default no). yes = Protect's enable3dnr drives mediad's
# temporal denoise (tdf); no = enable3dnr is ignored and tdf follows mediad.conf.
MEDIAD_3DNR=no

# YI_CLOUD: yes|no|(empty=auto). Runs the stock Yi cloud daemons so the camera
# still appears in the YI app; auto=on except on mediad builds (IS_MEDIAD=yes).
YI_CLOUD=

# SSH_PASSWORD: your own SSH password for root (and for the Protect account,
# if PROTECT_SSH is on). Hashed at boot; never stored in /etc as typed. Empty =
# no password login for root. Set one before the first boot.
SSH_PASSWORD=

# PROTECT_SSH: yes = Protect's device password (Protect's settings) also logs
# in, as Protect's user ("ui"; "ubnt" before adoption), with root rights like a
# native UniFi camera. Default no: Protect's credential push is only
# acknowledged and nothing of it is stored or accepted.
PROTECT_SSH=no

# WiFi provisioning: create yi-protect/etc/configure_wifi.cfg (or Factory/configure_wifi.cfg
# on a fresh card) with wifi_ssid=/wifi_psk= (see configure_wifi.cfg.example); init.sh writes it.

# Optional controller override (host or host:port); takes priority over DHCP
# discovery. Leave empty for DHCP-based discovery.
#CONTROLLER=protect-controller:7442

# Optional camera-identity override; empty = compiled-in "UVC G3 Instant" spoof.
# SYSID is hex.
#MODEL=UVC G3 Instant
#SYSID=0xa590
#FWVERSION=UVC.SAV532Q.v4.75.62.67.9cdac69.260331.1630

# Optional static network: if STATIC_IP and STATIC_MASK are set, the vendored
# wifidhcp.sh/ethdhcp.sh use them; DNS/GW optional. Empty = DHCP.
#STATIC_IP=
#STATIC_MASK=
#STATIC_GW=
#STATIC_DNS1=
#STATIC_DNS2=

# Settings page for mediad image controls (plain HTTP, unauthenticated on the LAN).
# WEBUI_PORT=80   (0 = off)

# Process watchdog poll interval (seconds). See yi-protect/script/watchdog.sh.
WATCHDOG_INTERVAL=10
